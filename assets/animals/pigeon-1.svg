<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pigeon state 1: standing -->
  <!-- Shadow -->
  <rect x="9" y="30" width="14" height="2" fill="#000000" opacity="0.2"/>
  <!-- Feet / legs -->
  <rect x="13" y="26" width="2" height="5" fill="#E08060"/>
  <rect x="18" y="26" width="2" height="5" fill="#E08060"/>
  <!-- Toes left -->
  <rect x="11" y="30" width="4" height="1" fill="#E08060"/>
  <rect x="12" y="31" width="2" height="1" fill="#C06040"/>
  <!-- Toes right -->
  <rect x="17" y="30" width="4" height="1" fill="#E08060"/>
  <rect x="18" y="31" width="2" height="1" fill="#C06040"/>
  <!-- Tail feathers -->
  <rect x="7"  y="22" width="8"  height="5"  fill="#5A5C6E"/>
  <rect x="7"  y="22" width="8"  height="1"  fill="#4A4C5E"/>
  <!-- Body -->
  <rect x="8"  y="14" width="16" height="13" fill="#7A7C90"/>
  <rect x="7"  y="16" width="18" height="10" fill="#8A8CA0"/>
  <!-- Wing -->
  <rect x="7"  y="16" width="6"  height="9"  fill="#6A6C80"/>
  <rect x="19" y="16" width="6"  height="9"  fill="#6A6C80"/>
  <rect x="7"  y="16" width="6"  height="1"  fill="#7A7C90"/>
  <rect x="19" y="16" width="6"  height="1"  fill="#7A7C90"/>
  <!-- Wing feather lines -->
  <rect x="8"  y="18" width="4"  height="1"  fill="#5A5C70"/>
  <rect x="8"  y="21" width="4"  height="1"  fill="#5A5C70"/>
  <rect x="20" y="18" width="4"  height="1"  fill="#5A5C70"/>
  <rect x="20" y="21" width="4"  height="1"  fill="#5A5C70"/>
  <!-- Breast (lighter) -->
  <rect x="12" y="18" width="8"  height="8"  fill="#9A9CB0"/>
  <!-- Iridescent neck (green-purple hint) -->
  <rect x="12" y="14" width="8"  height="5"  fill="#6A8870"/>
  <rect x="13" y="13" width="6"  height="4"  fill="#7A9880"/>
  <!-- Head -->
  <rect x="12" y="7"  width="8"  height="8"  fill="#8A8CA0"/>
  <rect x="11" y="8"  width="10" height="6"  fill="#9A9CB0"/>
  <!-- Beak -->
  <rect x="19" y="9"  width="5"  height="2"  fill="#B0B0B0"/>
  <rect x="21" y="10" width="4"  height="1"  fill="#909090"/>
  <!-- Eye -->
  <rect x="18" y="9"  width="3"  height="3"  fill="#FF6020"/>
  <rect x="19" y="9"  width="2"  height="2"  fill="#FF8040"/>
  <rect x="19" y="10" width="1"  height="1"  fill="#2C1010"/>
  <rect x="20" y="10" width="1"  height="1"  fill="#FFFFFF"/>
</svg>
