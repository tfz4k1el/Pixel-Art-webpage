<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Rabbit state 2: mid-hop (airborne, body stretched) -->
  <!-- No shadow (in air) -->
  <rect x="11" y="31" width="10" height="1" fill="#000000" opacity="0.1"/>
  <!-- Tail -->
  <rect x="22" y="13" width="4" height="3" fill="#FFFFFF"/>
  <!-- Body stretched horizontal -->
  <rect x="8"  y="14" width="16" height="8"  fill="#D8D0C8"/>
  <rect x="7"  y="15" width="18" height="6"  fill="#E8E0D8"/>
  <rect x="7"  y="15" width="2"  height="6"  fill="#F0E8E0"/>
  <!-- Back legs kicked out -->
  <rect x="5"  y="18" width="5"  height="3"  fill="#C8C0B8"/>
  <rect x="4"  y="20" width="5"  height="2"  fill="#B8B0A8"/>
  <!-- Front legs stretched forward -->
  <rect x="22" y="18" width="5"  height="3"  fill="#C8C0B8"/>
  <rect x="24" y="20" width="5"  height="2"  fill="#B8B0A8"/>
  <!-- Head (forward, slightly down) -->
  <rect x="18" y="10" width="9"  height="8"  fill="#E8E0D8"/>
  <rect x="17" y="11" width="10" height="6"  fill="#F0E8E0"/>
  <!-- Ears (swept back during hop) -->
  <rect x="19" y="4"  width="3"  height="9"  fill="#E0D8D0"/>
  <rect x="20" y="5"  width="1"  height="7"  fill="#E8A8A8"/>
  <rect x="23" y="5"  width="3"  height="8"  fill="#E0D8D0"/>
  <rect x="24" y="6"  width="1"  height="6"  fill="#E8A8A8"/>
  <!-- Eyes (wide, excited) -->
  <rect x="22" y="12" width="3" height="3" fill="#2C1010"/>
  <rect x="24" y="12" width="1" height="1" fill="#FFFFFF"/>
  <!-- Nose -->
  <rect x="24" y="15" width="2" height="1" fill="#E89090"/>
</svg>
