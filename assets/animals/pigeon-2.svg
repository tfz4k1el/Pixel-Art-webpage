<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pigeon state 2: pecking / head down -->
  <!-- Shadow -->
  <rect x="9" y="30" width="14" height="2" fill="#000000" opacity="0.2"/>
  <!-- Feet / legs (one forward) -->
  <rect x="11" y="24" width="2" height="7" fill="#E08060"/>
  <rect x="18" y="25" width="2" height="6" fill="#E08060"/>
  <!-- Toes -->
  <rect x="9"  y="30" width="4" height="1" fill="#E08060"/>
  <rect x="17" y="30" width="4" height="1" fill="#E08060"/>
  <!-- Tail feathers (raised while pecking) -->
  <rect x="6"  y="16" width="8"  height="6"  fill="#5A5C6E"/>
  <rect x="5"  y="14" width="7"  height="5"  fill="#4A4C5E"/>
  <!-- Body (tilted forward) -->
  <rect x="7"  y="18" width="18" height="11" fill="#7A7C90"/>
  <rect x="6"  y="20" width="20" height="9"  fill="#8A8CA0"/>
  <!-- Wings -->
  <rect x="6"  y="19" width="6"  height="9"  fill="#6A6C80"/>
  <rect x="20" y="19" width="6"  height="9"  fill="#6A6C80"/>
  <rect x="7"  y="21" width="4"  height="1"  fill="#5A5C70"/>
  <rect x="21" y="21" width="4"  height="1"  fill="#5A5C70"/>
  <!-- Breast -->
  <rect x="12" y="21" width="8"  height="7"  fill="#9A9CB0"/>
  <!-- Neck stretched down (pecking) -->
  <rect x="14" y="12" width="6"  height="8"  fill="#6A8870"/>
  <rect x="14" y="10" width="5"  height="5"  fill="#7A9880"/>
  <!-- Head down at beak level -->
  <rect x="13" y="17" width="8"  height="7"  fill="#8A8CA0"/>
  <rect x="12" y="18" width="10" height="5"  fill="#9A9CB0"/>
  <!-- Beak at ground (pecking pose) -->
  <rect x="20" y="22" width="6"  height="2"  fill="#B0B0B0"/>
  <rect x="22" y="23" width="5"  height="1"  fill="#909090"/>
  <!-- Eye -->
  <rect x="19" y="19" width="3"  height="3"  fill="#FF6020"/>
  <rect x="20" y="19" width="2"  height="2"  fill="#FF8040"/>
  <rect x="20" y="20" width="1"  height="1"  fill="#2C1010"/>
  <rect x="21" y="20" width="1"  height="1"  fill="#FFFFFF"/>
</svg>
