<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Bright midday boulder — cool blue-grey, stark highlight/shadow contrast -->

  <!-- Cast shadow on grass -->
  <rect x="4"  y="26" width="22" height="3"  fill="#3A5020" opacity="0.28"/>

  <!-- ── Rock body (organic rounded boulder) ── -->
  <!-- Deep shadow underside -->
  <rect x="9"  y="23" width="14" height="2"  fill="#424E5E"/>
  <rect x="7"  y="20" width="18" height="5"  fill="#525F72"/>
  <rect x="5"  y="18" width="20" height="5"  fill="#606E80"/>
  <!-- Right shadow face -->
  <rect x="22" y="10" width="5"  height="12" fill="#606E80"/>
  <rect x="24" y="12" width="4"  height="10" fill="#525F72"/>
  <!-- Mid body (neutral blue-grey) -->
  <rect x="5"  y="13" width="20" height="8"  fill="#8892A4"/>
  <rect x="6"  y="11" width="18" height="10" fill="#9298AB"/>
  <!-- Upper lit face (transitioning to bright) -->
  <rect x="6"  y="9"  width="18" height="5"  fill="#B4BBCA"/>
  <rect x="8"  y="7"  width="16" height="5"  fill="#C8CEDB"/>
  <!-- Top lit area (sky-reflected bright) -->
  <rect x="9"  y="5"  width="14" height="5"  fill="#DADFE9"/>
  <rect x="11" y="4"  width="10" height="4"  fill="#E6EAF2"/>
  <!-- Peak highlight (near-white, direct sun) -->
  <rect x="12" y="3"  width="8"  height="3"  fill="#F0F2F8"/>
  <rect x="13" y="2"  width="6"  height="2"  fill="#F8FAFC"/>
  <rect x="14" y="1"  width="4"  height="2"  fill="#FDFEFF"/>

  <!-- ── Rock shape border (organic silhouette) ── -->
  <!-- Top edge roundness -->
  <rect x="11" y="1"  width="2"  height="1"  fill="#E6EAF2"/>
  <rect x="19" y="1"  width="2"  height="1"  fill="#E6EAF2"/>
  <!-- Bottom edge roundness -->
  <rect x="7"  y="24" width="2"  height="1"  fill="#424E5E"/>
  <rect x="21" y="24" width="2"  height="1"  fill="#424E5E"/>

  <!-- ── Surface crevice detail ── -->
  <rect x="10" y="13" width="1"  height="5"  fill="#737E90"/>
  <rect x="11" y="12" width="1"  height="1"  fill="#737E90"/>
  <rect x="18" y="10" width="1"  height="4"  fill="#7E8994"/>

  <!-- ── Moss / grass at rock base ── -->
  <rect x="4"  y="23" width="4"  height="2"  fill="#5AB82E"/>
  <rect x="5"  y="22" width="3"  height="2"  fill="#68D03A"/>
  <rect x="20" y="23" width="5"  height="2"  fill="#5AB82E"/>
  <rect x="21" y="22" width="3"  height="2"  fill="#68D03A"/>
  <rect x="11" y="25" width="8"  height="2"  fill="#5AB82E"/>

  <!-- ── Sparkle flower beside rock ── -->
  <rect x="27" y="19" width="1"  height="6"  fill="#F8E028"/>
  <rect x="25" y="21" width="5"  height="1"  fill="#F8E028"/>
  <!-- Diagonal sparkle dots -->
  <rect x="26" y="20" width="1"  height="1"  fill="#F8E028"/>
  <rect x="28" y="20" width="1"  height="1"  fill="#F8E028"/>
  <rect x="26" y="23" width="1"  height="1"  fill="#F8E028"/>
  <rect x="28" y="23" width="1"  height="1"  fill="#F8E028"/>
  <!-- White center -->
  <rect x="27" y="21" width="1"  height="1"  fill="#FFFFFF"/>
</svg>
