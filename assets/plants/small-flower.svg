<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Small sparkle cross-flower (like the + glints in reference) -->
  <!-- Vertical arm -->
  <rect x="15" y="10" width="2" height="12" fill="#FFE840"/>
  <!-- Horizontal arm -->
  <rect x="10" y="15" width="12" height="2" fill="#FFE840"/>
  <!-- Centre bright white -->
  <rect x="14" y="14" width="4" height="4" fill="#FFFFFF"/>
  <!-- Outer tips fade -->
  <rect x="15" y="9"  width="2" height="2"  fill="#FFD020" opacity="0.7"/>
  <rect x="15" y="21" width="2" height="2"  fill="#FFD020" opacity="0.7"/>
  <rect x="9"  y="15" width="2" height="2"  fill="#FFD020" opacity="0.7"/>
  <rect x="21" y="15" width="2" height="2"  fill="#FFD020" opacity="0.7"/>
  <!-- Diagonal glints -->
  <rect x="13" y="13" width="1" height="1"  fill="#FFFFFF" opacity="0.5"/>
  <rect x="18" y="13" width="1" height="1"  fill="#FFFFFF" opacity="0.5"/>
  <rect x="13" y="18" width="1" height="1"  fill="#FFFFFF" opacity="0.5"/>
  <rect x="18" y="18" width="1" height="1"  fill="#FFFFFF" opacity="0.5"/>
</svg>
