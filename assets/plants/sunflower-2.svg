<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wind state 2: head drifts LEFT, stem curves left -->

  <!-- Stem: base fixed at x=15, curves to x=13 at top -->
  <rect x="14" y="28" width="3" height="4"  fill="#4A8025"/>
  <rect x="14" y="24" width="3" height="5"  fill="#4A8025"/>
  <rect x="14" y="24" width="1" height="5"  fill="#5BA030"/>
  <rect x="13" y="20" width="3" height="5"  fill="#4A8025"/>
  <rect x="13" y="20" width="1" height="5"  fill="#5BA030"/>
  <rect x="12" y="16" width="3" height="5"  fill="#4A8025"/>
  <rect x="12" y="16" width="1" height="5"  fill="#5BA030"/>

  <!-- Left leaf (shifted left) -->
  <rect x="5"  y="22" width="7"  height="3"  fill="#4A8025"/>
  <rect x="5"  y="22" width="1"  height="3"  fill="#5BA030"/>
  <rect x="11" y="22" width="1"  height="3"  fill="#3A6B1A"/>

  <!-- Right leaf (shifted left) -->
  <rect x="15" y="25" width="7"  height="3"  fill="#4A8025"/>
  <rect x="15" y="25" width="1"  height="3"  fill="#5BA030"/>
  <rect x="21" y="25" width="1"  height="3"  fill="#3A6B1A"/>

  <!-- FLOWER HEAD: center at (13, 10) — shifted left -->
  <!-- Petals (yellow) -->
  <!-- North -->
  <rect x="11" y="2"  width="4"  height="5"  fill="#F5D020"/>
  <rect x="11" y="2"  width="4"  height="2"  fill="#FFE840"/>
  <!-- NE -->
  <rect x="16" y="3"  width="4"  height="4"  fill="#F5D020"/>
  <rect x="16" y="3"  width="4"  height="1"  fill="#FFE840"/>
  <!-- East -->
  <rect x="18" y="8"  width="5"  height="4"  fill="#F5D020"/>
  <rect x="22" y="8"  width="1"  height="4"  fill="#D4A800"/>
  <!-- SE -->
  <rect x="16" y="14" width="4"  height="4"  fill="#F5D020"/>
  <rect x="19" y="14" width="1"  height="4"  fill="#D4A800"/>
  <!-- South -->
  <rect x="11" y="15" width="4"  height="5"  fill="#F5D020"/>
  <rect x="11" y="19" width="4"  height="1"  fill="#D4A800"/>
  <!-- SW -->
  <rect x="6"  y="14" width="4"  height="4"  fill="#F5D020"/>
  <!-- West -->
  <rect x="3"  y="8"  width="5"  height="4"  fill="#F5D020"/>
  <rect x="3"  y="8"  width="1"  height="4"  fill="#FFE840"/>
  <!-- NW -->
  <rect x="6"  y="3"  width="4"  height="4"  fill="#F5D020"/>
  <rect x="6"  y="3"  width="1"  height="4"  fill="#FFE840"/>

  <!-- Center -->
  <rect x="8"  y="6"  width="10" height="10" fill="#5A3010"/>
  <rect x="9"  y="7"  width="8"  height="8"  fill="#7A4020"/>
  <rect x="10" y="8"  width="6"  height="6"  fill="#9A5030"/>
  <!-- Seed texture -->
  <rect x="9"  y="8"  width="2"  height="2"  fill="#5A3010"/>
  <rect x="12" y="8"  width="2"  height="2"  fill="#5A3010"/>
  <rect x="9"  y="11" width="2"  height="2"  fill="#5A3010"/>
  <rect x="12" y="11" width="2"  height="2"  fill="#5A3010"/>
  <rect x="11" y="10" width="2"  height="1"  fill="#6A3818"/>
  <rect x="10" y="8"  width="2"  height="1"  fill="#BA7040"/>
</svg>
