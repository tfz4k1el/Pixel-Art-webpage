<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wind state 2: rose head drifts LEFT -->

  <!-- Stem: base x=15, curves to x=13 at top -->
  <rect x="15" y="28" width="2" height="4"  fill="#3A6B1A"/>
  <rect x="15" y="28" width="1" height="4"  fill="#5BA030"/>
  <rect x="15" y="23" width="2" height="6"  fill="#3A6B1A"/>
  <rect x="15" y="23" width="1" height="6"  fill="#5BA030"/>
  <rect x="14" y="19" width="2" height="5"  fill="#3A6B1A"/>
  <rect x="14" y="19" width="1" height="5"  fill="#5BA030"/>
  <rect x="13" y="15" width="2" height="5"  fill="#3A6B1A"/>
  <rect x="13" y="15" width="1" height="5"  fill="#5BA030"/>

  <!-- Thorns -->
  <rect x="17" y="25" width="2" height="1"  fill="#2A5010"/>
  <rect x="13" y="21" width="2" height="1"  fill="#2A5010"/>

  <!-- Left leaf (shifted left) -->
  <rect x="5"  y="20" width="8"  height="4"  fill="#4A8025"/>
  <rect x="5"  y="20" width="1"  height="4"  fill="#5BA030"/>
  <rect x="12" y="20" width="1"  height="4"  fill="#3A6B1A"/>
  <rect x="6"  y="23" width="6"  height="1"  fill="#3A6B1A"/>

  <!-- Right leaf (shifted left) -->
  <rect x="13" y="23" width="8"  height="4"  fill="#4A8025"/>
  <rect x="13" y="23" width="1"  height="4"  fill="#5BA030"/>
  <rect x="20" y="23" width="1"  height="4"  fill="#3A6B1A"/>
  <rect x="14" y="26" width="6"  height="1"  fill="#3A6B1A"/>

  <!-- ROSE HEAD: center drifted -2 left, centered around x=14 -->
  <!-- Sepals -->
  <rect x="10" y="13" width="10" height="3"  fill="#4A8025"/>
  <rect x="9"  y="12" width="3"  height="3"  fill="#3A6B1A"/>
  <rect x="17" y="12" width="3"  height="3"  fill="#3A6B1A"/>

  <!-- Outer guard petals -->
  <rect x="9"  y="3"  width="10" height="5"  fill="#FFFFFF"/>   <!-- top -->
  <rect x="5"  y="7"  width="7"  height="7"  fill="#FFFFFF"/>   <!-- left -->
  <rect x="17" y="7"  width="7"  height="7"  fill="#FFFFFF"/>   <!-- right -->
  <!-- Highlights -->
  <rect x="9"  y="3"  width="10" height="1"  fill="#F0F8FF"/>
  <rect x="5"  y="7"  width="1"  height="7"  fill="#F0F8FF"/>
  <!-- Shadows -->
  <rect x="23" y="7"  width="1"  height="7"  fill="#E0D0CC"/>
  <rect x="5"  y="13" width="7"  height="1"  fill="#E0D0CC"/>
  <rect x="17" y="13" width="7"  height="1"  fill="#E0D0CC"/>

  <!-- Middle petal layer -->
  <rect x="8"  y="5"  width="13" height="9"  fill="#FFF4F0"/>
  <rect x="7"  y="7"  width="15" height="7"  fill="#FFF4F0"/>

  <!-- Inner petals -->
  <rect x="9"  y="6"  width="11" height="7"  fill="#FFEAE8"/>
  <rect x="10" y="5"  width="9"  height="8"  fill="#FFE4E0"/>

  <!-- Tight centre spiral -->
  <rect x="11" y="7"  width="6"  height="5"  fill="#FFD8D0"/>
  <rect x="12" y="7"  width="4"  height="4"  fill="#FFCCC4"/>
  <rect x="13" y="8"  width="2"  height="2"  fill="#FFBCB0"/>

  <!-- Petal fold lines -->
  <rect x="10" y="9"  width="1"  height="3"  fill="#D8B8B0"/>
  <rect x="13" y="8"  width="1"  height="4"  fill="#D8B8B0"/>
  <rect x="16" y="9"  width="1"  height="3"  fill="#D8B8B0"/>
  <rect x="10" y="5"  width="9"  height="1"  fill="#EDD8D4"/>
</svg>
