<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wind state 1: head drifts RIGHT, stem curves right -->

  <!-- Stem: base fixed at x=15, curves to x=17 at top -->
  <rect x="15" y="28" width="3" height="4"  fill="#4A8025"/>
  <rect x="15" y="24" width="3" height="5"  fill="#4A8025"/>
  <rect x="15" y="24" width="1" height="5"  fill="#5BA030"/>
  <rect x="16" y="20" width="3" height="5"  fill="#4A8025"/>
  <rect x="16" y="20" width="1" height="5"  fill="#5BA030"/>
  <rect x="17" y="16" width="3" height="5"  fill="#4A8025"/>
  <rect x="17" y="16" width="1" height="5"  fill="#5BA030"/>

  <!-- Left leaf -->
  <rect x="9"  y="22" width="7"  height="3"  fill="#4A8025"/>
  <rect x="9"  y="22" width="1"  height="3"  fill="#5BA030"/>
  <rect x="14" y="22" width="1"  height="3"  fill="#3A6B1A"/>

  <!-- Right leaf -->
  <rect x="19" y="25" width="7"  height="3"  fill="#4A8025"/>
  <rect x="19" y="25" width="1"  height="3"  fill="#5BA030"/>
  <rect x="25" y="25" width="1"  height="3"  fill="#3A6B1A"/>

  <!-- FLOWER HEAD: center at (19, 10) — shifted right -->
  <!-- Petals (yellow) -->
  <!-- North -->
  <rect x="17" y="2"  width="4"  height="5"  fill="#F5D020"/>
  <rect x="17" y="2"  width="4"  height="2"  fill="#FFE840"/>
  <!-- NE -->
  <rect x="22" y="3"  width="4"  height="4"  fill="#F5D020"/>
  <rect x="22" y="3"  width="4"  height="1"  fill="#FFE840"/>
  <!-- East -->
  <rect x="24" y="8"  width="5"  height="4"  fill="#F5D020"/>
  <rect x="28" y="8"  width="1"  height="4"  fill="#D4A800"/>
  <!-- SE -->
  <rect x="22" y="14" width="4"  height="4"  fill="#F5D020"/>
  <rect x="25" y="14" width="1"  height="4"  fill="#D4A800"/>
  <!-- South -->
  <rect x="17" y="15" width="4"  height="5"  fill="#F5D020"/>
  <rect x="17" y="19" width="4"  height="1"  fill="#D4A800"/>
  <!-- SW -->
  <rect x="12" y="14" width="4"  height="4"  fill="#F5D020"/>
  <!-- West -->
  <rect x="9"  y="8"  width="5"  height="4"  fill="#F5D020"/>
  <rect x="9"  y="8"  width="1"  height="4"  fill="#FFE840"/>
  <!-- NW -->
  <rect x="12" y="3"  width="4"  height="4"  fill="#F5D020"/>
  <rect x="12" y="3"  width="1"  height="4"  fill="#FFE840"/>

  <!-- Center (dark seed head) -->
  <rect x="14" y="6"  width="10" height="10" fill="#5A3010"/>
  <rect x="15" y="7"  width="8"  height="8"  fill="#7A4020"/>
  <rect x="16" y="8"  width="6"  height="6"  fill="#9A5030"/>
  <!-- Seed texture dots -->
  <rect x="15" y="8"  width="2"  height="2"  fill="#5A3010"/>
  <rect x="18" y="8"  width="2"  height="2"  fill="#5A3010"/>
  <rect x="15" y="11" width="2"  height="2"  fill="#5A3010"/>
  <rect x="18" y="11" width="2"  height="2"  fill="#5A3010"/>
  <rect x="17" y="10" width="2"  height="1"  fill="#6A3818"/>
  <!-- Centre highlight -->
  <rect x="16" y="8"  width="2"  height="1"  fill="#BA7040"/>
</svg>
