<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wind state 2: blades lean LEFT — roots fixed at same x as state 1, tips blown left -->
  <!-- Tuft 1: root x=7 → tip x=3 -->
  <rect x="7" y="26" width="2" height="6" fill="#4A8025"/>
  <rect x="6" y="20" width="2" height="7" fill="#74BC48"/>
  <rect x="5" y="14" width="2" height="7" fill="#5C9E31"/>
  <rect x="4" y="8"  width="2" height="7" fill="#4A8025"/>
  <rect x="3" y="2"  width="2" height="7" fill="#74BC48"/>

  <!-- Tuft 2: root x=15 → tip x=11 -->
  <rect x="15" y="26" width="2" height="6" fill="#5C9E31"/>
  <rect x="14" y="20" width="2" height="7" fill="#4A8025"/>
  <rect x="13" y="14" width="2" height="7" fill="#74BC48"/>
  <rect x="12" y="8"  width="2" height="7" fill="#5C9E31"/>
  <rect x="11" y="2"  width="2" height="7" fill="#4A8025"/>

  <!-- Tuft 3: root x=23 → tip x=19 -->
  <rect x="23" y="26" width="2" height="6" fill="#4A8025"/>
  <rect x="22" y="20" width="2" height="7" fill="#74BC48"/>
  <rect x="21" y="14" width="2" height="7" fill="#5C9E31"/>
  <rect x="20" y="8"  width="2" height="7" fill="#4A8025"/>
  <rect x="19" y="2"  width="2" height="7" fill="#74BC48"/>
</svg>
