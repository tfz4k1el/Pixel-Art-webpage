<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wind state 1: rose head drifts RIGHT -->

  <!-- Stem: base x=15, curves to x=17 at top -->
  <rect x="15" y="28" width="2" height="4"  fill="#3A6B1A"/>
  <rect x="15" y="28" width="1" height="4"  fill="#5BA030"/>
  <rect x="15" y="23" width="2" height="6"  fill="#3A6B1A"/>
  <rect x="15" y="23" width="1" height="6"  fill="#5BA030"/>
  <rect x="16" y="19" width="2" height="5"  fill="#3A6B1A"/>
  <rect x="16" y="19" width="1" height="5"  fill="#5BA030"/>
  <rect x="17" y="15" width="2" height="5"  fill="#3A6B1A"/>
  <rect x="17" y="15" width="1" height="5"  fill="#5BA030"/>

  <!-- Thorns -->
  <rect x="13" y="25" width="2" height="1"  fill="#2A5010"/>
  <rect x="17" y="21" width="2" height="1"  fill="#2A5010"/>

  <!-- Left leaf -->
  <rect x="8"  y="20" width="8"  height="4"  fill="#4A8025"/>
  <rect x="8"  y="20" width="1"  height="4"  fill="#5BA030"/>
  <rect x="15" y="20" width="1"  height="4"  fill="#3A6B1A"/>
  <rect x="9"  y="23" width="6"  height="1"  fill="#3A6B1A"/>

  <!-- Right leaf -->
  <rect x="17" y="23" width="8"  height="4"  fill="#4A8025"/>
  <rect x="17" y="23" width="1"  height="4"  fill="#5BA030"/>
  <rect x="24" y="23" width="1"  height="4"  fill="#3A6B1A"/>
  <rect x="18" y="26" width="6"  height="1"  fill="#3A6B1A"/>

  <!-- ROSE HEAD: center drifted +2 right, centered around x=18 -->
  <!-- Sepals (green base of flower) -->
  <rect x="14" y="13" width="10" height="3"  fill="#4A8025"/>
  <rect x="13" y="12" width="3"  height="3"  fill="#3A6B1A"/>
  <rect x="21" y="12" width="3"  height="3"  fill="#3A6B1A"/>

  <!-- Outer guard petals -->
  <rect x="13" y="3"  width="10" height="5"  fill="#FFFFFF"/>   <!-- top -->
  <rect x="9"  y="7"  width="7"  height="7"  fill="#FFFFFF"/>   <!-- left -->
  <rect x="21" y="7"  width="7"  height="7"  fill="#FFFFFF"/>   <!-- right -->
  <!-- Outer petal highlights -->
  <rect x="13" y="3"  width="10" height="1"  fill="#F0F8FF"/>
  <rect x="9"  y="7"  width="1"  height="7"  fill="#F0F8FF"/>
  <!-- Outer petal shadows -->
  <rect x="27" y="7"  width="1"  height="7"  fill="#E0D0CC"/>
  <rect x="9"  y="13" width="7"  height="1"  fill="#E0D0CC"/>
  <rect x="21" y="13" width="7"  height="1"  fill="#E0D0CC"/>

  <!-- Middle petal layer -->
  <rect x="12" y="5"  width="13" height="9"  fill="#FFF4F0"/>
  <rect x="11" y="7"  width="15" height="7"  fill="#FFF4F0"/>

  <!-- Inner petals -->
  <rect x="13" y="6"  width="11" height="7"  fill="#FFEAE8"/>
  <rect x="14" y="5"  width="9"  height="8"  fill="#FFE4E0"/>

  <!-- Tight centre spiral -->
  <rect x="15" y="7"  width="6"  height="5"  fill="#FFD8D0"/>
  <rect x="16" y="7"  width="4"  height="4"  fill="#FFCCC4"/>
  <rect x="17" y="8"  width="2"  height="2"  fill="#FFBCB0"/>

  <!-- Petal fold definition lines -->
  <rect x="14" y="9"  width="1"  height="3"  fill="#D8B8B0"/>
  <rect x="17" y="8"  width="1"  height="4"  fill="#D8B8B0"/>
  <rect x="20" y="9"  width="1"  height="3"  fill="#D8B8B0"/>
  <rect x="14" y="5"  width="9"  height="1"  fill="#EDD8D4"/>
</svg>
