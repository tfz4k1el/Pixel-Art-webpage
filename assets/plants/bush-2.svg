<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Bush wind state 2 — lean left, bright mid-summer colours -->

  <!-- Cast shadow -->
  <rect x="5"  y="28" width="22" height="3"  fill="#3A5020" opacity="0.30"/>

  <!-- Base / ground contact shadow -->
  <rect x="5"  y="24" width="22" height="5"  fill="#2E6A1E"/>

  <!-- Main canopy body -->
  <rect x="3"  y="18" width="26" height="9"  fill="#3C8C2A"/>
  <rect x="2"  y="20" width="28" height="7"  fill="#48A032"/>

  <!-- Upper canopy (shifted slightly left — wind state 2) -->
  <rect x="4"  y="12" width="22" height="10" fill="#44A030"/>
  <rect x="5"  y="8"  width="18" height="8"  fill="#50B83A"/>
  <rect x="6"  y="5"  width="14" height="6"  fill="#5AC842"/>

  <!-- Sunlit highlights (left-upper, wind-lifted) -->
  <rect x="5"  y="6"  width="7"  height="5"  fill="#68D84E"/>
  <rect x="4"  y="9"  width="6"  height="4"  fill="#78E858"/>
  <rect x="8"  y="5"  width="6"  height="3"  fill="#72E054"/>

  <!-- Right shadow side -->
  <rect x="23" y="18" width="7"  height="9"  fill="#2E6A1E"/>
  <rect x="24" y="15" width="5"  height="6"  fill="#347820"/>

  <!-- Underside shadow -->
  <rect x="4"  y="24" width="24" height="2"  fill="#2A5A18"/>
</svg>
