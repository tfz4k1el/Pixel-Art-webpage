<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Bright midday mushroom — vivid red, warm lit stem -->

  <!-- Cast shadow -->
  <rect x="9"  y="28" width="14" height="3"  fill="#3A5020" opacity="0.25"/>

  <!-- Stem -->
  <rect x="13" y="19" width="6"  height="9"  fill="#EEE4CC"/>
  <rect x="13" y="19" width="1"  height="9"  fill="#FFFAE8"/>
  <rect x="18" y="19" width="1"  height="9"  fill="#D8CEB8"/>
  <!-- Stem base flare (sits in grass) -->
  <rect x="11" y="25" width="10" height="3"  fill="#E0D4BC"/>
  <rect x="10" y="26" width="12" height="2"  fill="#D0C4AC"/>

  <!-- ── Cap ── -->
  <!-- Gill shadow under cap rim -->
  <rect x="5"  y="17" width="22" height="4"  fill="#CC2020"/>
  <rect x="4"  y="18" width="24" height="3"  fill="#B81818"/>

  <!-- Main cap -->
  <rect x="4"  y="9"  width="24" height="10" fill="#EE4030"/>
  <rect x="2"  y="12" width="28" height="7"  fill="#F04838"/>
  <rect x="6"  y="7"  width="20" height="6"  fill="#F04838"/>

  <!-- Cap top -->
  <rect x="9"  y="5"  width="14" height="5"  fill="#FF5A44"/>
  <rect x="12" y="3"  width="8"  height="4"  fill="#FF6650"/>

  <!-- Sunlit top highlight (direct midday sun) -->
  <rect x="13" y="2"  width="7"  height="3"  fill="#FF8060"/>
  <rect x="14" y="1"  width="5"  height="2"  fill="#FFA080"/>
  <rect x="11" y="4"  width="5"  height="2"  fill="#FF8060"/>

  <!-- White spots (bright, well-lit) -->
  <rect x="6"  y="13" width="4"  height="4"  fill="#FFFFFF"/>
  <rect x="7"  y="12" width="2"  height="1"  fill="#FFFFFF"/>
  <rect x="21" y="12" width="4"  height="4"  fill="#FFFFFF"/>
  <rect x="22" y="11" width="2"  height="1"  fill="#FFFFFF"/>
  <rect x="13" y="8"  width="3"  height="3"  fill="#FFFFFF"/>
  <rect x="7"  y="8"  width="2"  height="2"  fill="#FFFFFF"/>
  <rect x="22" y="8"  width="2"  height="2"  fill="#FFFFFF"/>

  <!-- Spot highlight (sun hitting spots) -->
  <rect x="6"  y="13" width="1"  height="1"  fill="#F0F8FF"/>
  <rect x="21" y="12" width="1"  height="1"  fill="#F0F8FF"/>
</svg>
