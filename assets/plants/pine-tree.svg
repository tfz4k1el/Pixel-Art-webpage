<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Mid-summer midday pine — vibrant greens, strong top lighting -->

  <!-- Trunk -->
  <rect x="13" y="25" width="6"  height="7"  fill="#8B5A28"/>
  <rect x="13" y="25" width="1"  height="7"  fill="#B07840"/>
  <rect x="18" y="25" width="1"  height="7"  fill="#6A4218"/>
  <!-- Root flare -->
  <rect x="11" y="29" width="10" height="3"  fill="#7A4E20"/>

  <!-- ── Bottom tier ── -->
  <!-- Shadow underside of tier -->
  <rect x="4"  y="22" width="24" height="3"  fill="#2A6020"/>
  <!-- Main tier -->
  <rect x="5"  y="17" width="22" height="7"  fill="#3C8A28"/>
  <rect x="3"  y="19" width="26" height="5"  fill="#449630"/>
  <!-- Lit top edge of tier -->
  <rect x="4"  y="17" width="24" height="2"  fill="#52B038"/>
  <!-- Highlight tips -->
  <rect x="5"  y="16" width="4"  height="2"  fill="#60C840"/>
  <rect x="22" y="16" width="4"  height="2"  fill="#60C840"/>
  <rect x="13" y="15" width="5"  height="2"  fill="#60C840"/>

  <!-- ── Mid tier ── -->
  <rect x="8"  y="14" width="16" height="5"  fill="#2A6020"/>
  <rect x="7"  y="12" width="18" height="5"  fill="#3C8A28"/>
  <rect x="6"  y="13" width="20" height="4"  fill="#449630"/>
  <rect x="7"  y="12" width="18" height="2"  fill="#52B038"/>
  <!-- Mid tier highlights -->
  <rect x="9"  y="11" width="4"  height="2"  fill="#60C840"/>
  <rect x="18" y="11" width="4"  height="2"  fill="#60C840"/>

  <!-- ── Upper tier ── -->
  <rect x="11" y="9"  width="10" height="5"  fill="#2A6020"/>
  <rect x="10" y="8"  width="12" height="4"  fill="#3C8A28"/>
  <rect x="9"  y="9"  width="14" height="3"  fill="#449630"/>
  <rect x="10" y="8"  width="12" height="2"  fill="#52B038"/>
  <!-- Upper highlights -->
  <rect x="12" y="7"  width="4"  height="2"  fill="#60C840"/>
  <rect x="17" y="7"  width="3"  height="2"  fill="#6AD04A"/>

  <!-- ── Spire ── -->
  <rect x="13" y="3"  width="6"  height="7"  fill="#3C8A28"/>
  <rect x="14" y="2"  width="4"  height="5"  fill="#449630"/>
  <rect x="14" y="2"  width="4"  height="2"  fill="#52B038"/>
  <rect x="15" y="0"  width="2"  height="4"  fill="#60C840"/>
  <rect x="15" y="0"  width="2"  height="1"  fill="#80E060"/>
</svg>
