<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sky base -->
  <rect width="32" height="32" fill="#87CEEB"/>
  <!-- Lighter top band -->
  <rect x="0" y="0"  width="32" height="8"  fill="#A4DCF7"/>
  <!-- Mid band -->
  <rect x="0" y="8"  width="32" height="10" fill="#92D5F0"/>
  <!-- Lower, slightly deeper -->
  <rect x="0" y="26" width="32" height="6"  fill="#78C0E0"/>
  <!-- Tiny star dots (for atmosphere) -->
  <rect x="5"  y="2" width="1" height="1" fill="#D8EFFF" opacity="0.6"/>
  <rect x="18" y="1" width="1" height="1" fill="#D8EFFF" opacity="0.6"/>
  <rect x="28" y="4" width="1" height="1" fill="#D8EFFF" opacity="0.6"/>
</svg>
